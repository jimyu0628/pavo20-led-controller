<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>方案 B · 亮色极简</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --txt:#111114; --sub:#6c6c72; --sub2:#9a9aa0;
    --line:#e6e6ea; --blue:#0a84ff; --blue-d:#e8f1ff; --green:#34c759;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);padding:0 14px 100px;max-width:560px;margin:0 auto;
       font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px}

  /* 顶部 */
  .top{padding:18px 4px 14px}
  .top .row1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.4px}
  .sub{font-size:12.5px;color:var(--sub);margin-top:5px;display:flex;gap:7px;align-items:center}
  .badge{font-size:11px;padding:2px 7px;border-radius:5px;background:#e9e9ee;color:#7a7a80;font-weight:600}
  .online{display:flex;align-items:center;gap:5px;font-size:12px;color:#1f8b3f;flex:0 0 auto;
          background:var(--card);padding:6px 10px;border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .online i{width:7px;height:7px;border-radius:50%;background:var(--green)}

  /* 白色卡片 */
  .card{background:var(--card);border-radius:16px;padding:14px 15px 15px;margin-bottom:11px;
        box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card h2{margin:0 0 12px;font-size:12px;color:var(--sub2);font-weight:600;letter-spacing:.8px;
           display:flex;justify-content:space-between;align-items:baseline}
  .card h2 span{font-weight:400;letter-spacing:0;font-size:11.5px}

  /* 大状态卡 */
  .hero{background:linear-gradient(165deg,#ffffff,#fafafd)}
  .hero .big{font-size:27px;font-weight:700;letter-spacing:-.6px;line-height:1.2}
  .hero .big small{display:block;font-size:12px;color:var(--sub2);font-weight:600;letter-spacing:.8px;margin-bottom:6px}
  .hero .grid{display:flex;gap:0;margin-top:15px;border-top:1px solid var(--line);padding-top:13px}
  .hero .grid div{flex:1;text-align:center;position:relative}
  .hero .grid div+div::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;background:var(--line)}
  .hero .grid .k{font-size:11px;color:var(--sub2);letter-spacing:.5px}
  .hero .grid .v{font-size:17px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}

  /* 模式：两列 */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modes button{min-height:44px;padding:0 13px;border-radius:11px;border:1px solid var(--line);
                background:#fff;color:#3a3a40;font-size:13.5px;font-family:inherit;cursor:pointer;
                text-align:left;transition:.13s}
  .modes button:active{transform:scale(.97)}
  .modes button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:650;
                   box-shadow:0 3px 10px rgba(10,132,255,.28)}

  /* iOS 分段控件 */
  .seg{display:flex;background:#ececf1;border-radius:11px;padding:3px;gap:2px}
  .seg button{flex:1;min-height:34px;border:0;border-radius:9px;background:transparent;color:#4a4a50;
              font-size:13.5px;font-family:inherit;cursor:pointer;font-variant-numeric:tabular-nums;transition:.15s}
  .seg button.on{background:#fff;color:#000;font-weight:650;box-shadow:0 2px 5px rgba(0,0,0,.11)}

  /* 颜色 */
  .colors{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
  .sw{width:100%;aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;
      transition:transform .14s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
  .sw:active{transform:scale(.93)}
  .sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--blue)}
  .sw.off{background:repeating-linear-gradient(45deg,#fff 0 5px,#e2e2e8 5px 10px)!important;
          box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

  /* stepper */
  .step{display:flex;align-items:center;gap:0;background:#f4f4f8;border-radius:12px;padding:4px}
  .step button{width:52px;height:46px;border:0;border-radius:9px;background:#fff;color:var(--blue);
               font-size:22px;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);line-height:1}
  .step .num{flex:1;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .step .num small{font-size:12px;color:var(--sub2);font-weight:500;margin-left:3px}
  .presets{display:flex;gap:7px;margin-top:10px}
  .presets button{flex:1;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;
                  color:var(--sub);font-size:13px;font-family:inherit;cursor:pointer;font-variant-numeric:tabular-nums}
  .presets button.on{border-color:var(--blue);background:var(--blue-d);color:#0a6fd6;font-weight:650}

  /* 按钮 */
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:56px;border-radius:15px;
       text-decoration:none;font-size:16px;font-weight:650;border:0;font-family:inherit;
       background:#fff;color:#141418;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
  .btn svg{width:19px;height:19px}
  .btn.blue{background:var(--blue);color:#fff;box-shadow:0 6px 20px rgba(10,132,255,.30)}
  .stack{display:grid;gap:9px;margin-bottom:11px}
  .note{font-size:11.5px;color:var(--sub2);line-height:1.75;padding:0 5px}

  /* 空闲提示 */
  .idle{position:fixed;left:0;right:0;bottom:0;padding:11px 18px calc(11px + env(safe-area-inset-bottom));
        background:rgba(242,242,247,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
        font-size:12px;color:var(--sub);display:flex;align-items:center;gap:10px}
  .idle b{color:#b26a00;font-variant-numeric:tabular-nums;font-weight:650}
  .idle .bar{flex:1;height:4px;border-radius:4px;background:#dcdce2;overflow:hidden}
  .idle .bar i{display:block;height:100%;background:#ff9f0a;border-radius:4px;transition:width 1s linear}

  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);
         background:rgba(20,20,24,.88);color:#fff;font-size:14px;padding:11px 20px;border-radius:14px;
         opacity:0;transition:.18s;pointer-events:none;white-space:nowrap;z-index:9;backdrop-filter:blur(8px)}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>

<div class="top">
  <div class="row1">
    <div>
      <h1>灯带</h1>
      <div class="sub"><span id="dev">PavoLED-A3</span><span class="badge" id="ver">v32.21</span></div>
    </div>
    <div class="online"><i></i>已连接</div>
  </div>
</div>

<div class="card hero">
  <div class="big"><small>当前模式</small><span id="bigMode">双边跑马</span></div>
  <div class="grid">
    <div><div class="k">亮度</div><div class="v" id="sB">50%</div></div>
    <div><div class="k">速度</div><div class="v" id="sS">中</div></div>
    <div><div class="k">灯数</div><div class="v" id="sC">55</div></div>
  </div>
</div>

<div class="card">
  <h2>模式<span>点选即时生效</span></h2>
  <div class="modes" id="modes"></div>
</div>

<div class="card">
  <h2>亮度</h2>
  <div class="seg" id="brights"></div>
</div>

<div class="card">
  <h2>速度</h2>
  <div class="seg" id="speeds"></div>
</div>

<div class="card">
  <h2>颜色<span>单色类模式有效</span></h2>
  <div class="colors" id="colors"></div>
</div>

<div class="card">
  <h2>灯带长度<span>断电记忆</span></h2>
  <div class="step">
    <button onclick="bump(-1)">&minus;</button>
    <div class="num"><span id="cntV">55</span><small>颗</small></div>
    <button onclick="bump(1)">+</button>
  </div>
  <div class="presets" id="presets"></div>
</div>

<div class="stack">
  <a class="btn blue" href="https://app.betaflight.com" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v5h-5"/>
    </svg>
    打开 Betaflight 调参
  </a>
  <a class="btn" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 20h16"/>
    </svg>
    固件升级
  </a>
</div>

<div class="note">
  连着本热点时上面的调参按钮打不开——本热点不联外网，所有域名都会被指回 192.168.4.1。
  要离线用，请先断开热点、用移动数据打开 app.betaflight.com，再「添加到主屏幕」。
  飞场上更稳的是蓝牙：系统蓝牙里连同一台设备，直接在 Betaflight App 里选它。
</div>

<div class="idle">
  <span>空闲 <b id="idle">00:42</b> 后关闭无线</span>
  <span class="bar"><i id="idlebar"></i></span>
</div>

<div id="toast"></div>

<script>
var MODES=["飞控同步","常亮","呼吸","跑马","双边跑马","导向","增长","彩虹呼吸","彩虹渐变","双边彩虹"];
var COLORS=[["白","#ffffff"],["红","#ff3b30"],["黄","#ffd60a"],["蓝","#3b82f6"],["绿","#22c55e"],["青","#22d3ee"],["品红","#e879f9"],["关","#000000"]];
var SPEEDS=["快","中","慢"], BRIGHTS=["100%","75%","50%","25%"], PRESETS=[32,55,60,78];
var st={mode:4,color:0,speed:1,bright:2,count:55};

function E(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}

function build(){
  var m=document.getElementById("modes"); m.innerHTML="";
  MODES.forEach(function(nm,i){
    var b=E("button",i==st.mode?"on":"",("0"+i).slice(-2)+" "+nm);
    b.onclick=function(){st.mode=i;build();sync();toast(nm);};
    m.appendChild(b);
  });
  seg("brights",BRIGHTS,st.bright,function(i){st.bright=i;build();sync();toast("亮度 "+BRIGHTS[i]);});
  seg("speeds",SPEEDS,st.speed,function(i){st.speed=i;build();sync();toast("速度 "+SPEEDS[i]);});

  var c=document.getElementById("colors"); c.innerHTML="";
  COLORS.forEach(function(o,i){
    var b=E("button","sw"+(i==st.color?" on":"")+(i==7?" off":""));
    b.style.background=o[1]; b.title=o[0];
    b.onclick=function(){st.color=i;build();sync();toast(o[0]);};
    c.appendChild(b);
  });

  var p=document.getElementById("presets"); p.innerHTML="";
  PRESETS.forEach(function(n){
    var b=E("button",n==st.count?"on":"",String(n));
    b.onclick=function(){st.count=n;build();sync();toast("灯数 "+n);};
    p.appendChild(b);
  });
}
function seg(id,arr,cur,cb){
  var box=document.getElementById(id); box.innerHTML="";
  arr.forEach(function(nm,i){
    var b=E("button",i==cur?"on":"",nm);
    b.onclick=function(){cb(i);};
    box.appendChild(b);
  });
}
function sync(){
  document.getElementById("bigMode").textContent=MODES[st.mode];
  document.getElementById("sB").textContent=BRIGHTS[st.bright];
  document.getElementById("sS").textContent=SPEEDS[st.speed];
  document.getElementById("sC").textContent=st.count;
  document.getElementById("cntV").textContent=st.count;
}
function bump(d){
  var n=st.count+d;
  if(n<1)n=1; if(n>128)n=128;
  st.count=n; build(); sync();
}
var tt=null;
function toast(t){
  var d=document.getElementById("toast"); d.textContent=t; d.classList.add("show");
  clearTimeout(tt); tt=setTimeout(function(){d.classList.remove("show");},1400);
}
var left=42;
setInterval(function(){
  left=left>0?left-1:60;
  document.getElementById("idle").textContent="00:"+(left<10?"0":"")+left;
  document.getElementById("idlebar").style.width=(left/60*100)+"%";
},1000);

build(); sync();
</script>
</body>
</html>
