<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 A · 深色面板</title>
<style>
  :root{
    --bg:#0b0b0d; --card:#17171a; --card2:#1e1e22; --line:#2a2a30;
    --txt:#ececee; --dim:#8a8a92; --dim2:#5e5e66;
    --amber:#ffb454; --amber-d:#3a2a10; --blue:#2d7ff9; --green:#3ddc84;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       padding:14px 14px 96px;max-width:560px;margin:0 auto;font-size:15px}

  /* 顶栏 */
  header{display:flex;align-items:center;gap:11px;padding:4px 2px 14px}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(150deg,#2a1c06,#181818);
        border:1px solid #3a2a10;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .logo svg{width:22px;height:22px}
  .htxt{flex:1;min-width:0}
  .htxt h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  .htxt .m{font-size:12px;color:var(--dim);margin-top:3px;display:flex;gap:8px;align-items:center}
  .chip{font-size:11px;padding:2px 7px;border-radius:6px;background:#22222a;color:#b9b9c2;border:1px solid var(--line)}
  .live{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--green);
        background:#0f2418;border:1px solid #1c4530;padding:5px 9px;border-radius:20px;flex:0 0 auto}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

  /* 状态三格 */
  .stats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
  .stat .k{font-size:11px;color:var(--dim2);letter-spacing:.4px}
  .stat .v{font-size:15px;font-weight:650;margin-top:4px;color:var(--txt);white-space:nowrap;
           overflow:hidden;text-overflow:ellipsis}
  .stat .v.acc{color:var(--amber)}

  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px 14px;margin-bottom:11px}
  .card h2{font-size:12.5px;margin:0 0 11px;color:var(--dim);font-weight:600;letter-spacing:.7px;
           display:flex;align-items:center;justify-content:space-between}
  .card h2 .hint{font-size:11px;color:var(--dim2);font-weight:400;letter-spacing:0}

  /* 模式网格 */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mode{display:flex;align-items:center;gap:9px;min-height:46px;padding:0 10px;border-radius:10px;
        background:var(--card2);border:1px solid #26262c;color:#c7c7d0;font-size:13.5px;
        text-align:left;font-family:inherit;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
  .mode .n{width:19px;height:19px;border-radius:5px;background:#2c2c34;color:#7b7b85;font-size:11px;
           display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .mode:active{transform:scale(.985)}
  .mode.on{background:var(--amber-d);border-color:#8a6320;color:var(--amber);font-weight:600}
  .mode.on .n{background:#8a6320;color:#1a1000}

  /* 并排两卡 */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
  .duo .card{margin:0}

  /* 分段控件 */
  .seg{display:flex;background:#101014;border:1px solid #26262c;border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;min-height:38px;border:0;border-radius:8px;background:transparent;color:#9a9aa4;
              font-size:13px;font-family:inherit;cursor:pointer;font-variant-numeric:tabular-nums;transition:.12s}
  .seg button.on{background:var(--amber);color:#1a1000;font-weight:700}
  .seg.small button{font-size:12px}

  /* 颜色 */
  .colors{display:grid;grid-template-columns:repeat(8,1fr);gap:9px}
  .sw{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #33333b;padding:0;cursor:pointer;
      position:relative;transition:transform .12s}
  .sw:active{transform:scale(.94)}
  .sw.on{border-color:#fff;transform:scale(1.06);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
  .sw.off{background:repeating-linear-gradient(45deg,#1a1a1e 0 5px,#26262c 5px 10px)!important}

  /* 灯带长度 */
  .lenrow{display:flex;gap:8px;align-items:center}
  .lenrow input{flex:1;min-height:46px;background:#101014;border:1px solid #2a2a30;border-radius:10px;
                color:var(--txt);font-size:17px;padding:0 12px;font-family:inherit;font-variant-numeric:tabular-nums}
  .lenrow input:focus{outline:0;border-color:#8a6320}
  .apply{min-height:46px;padding:0 18px;border-radius:10px;background:#2c2c34;border:1px solid #3a3a42;
         color:var(--txt);font-size:14px;font-family:inherit;cursor:pointer}
  .chips{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  .chips button{flex:1;min-width:56px;min-height:36px;border-radius:8px;background:#1e1e23;
                border:1px solid #2c2c34;color:#a6a6b0;font-size:13px;font-family:inherit;cursor:pointer;
                font-variant-numeric:tabular-nums}
  .chips button.on{background:#3a2a10;border-color:#8a6320;color:var(--amber);font-weight:600}

  /* 操作按钮 */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;border-radius:12px;
       text-decoration:none;font-size:14.5px;font-weight:600;border:1px solid #2c2c34;background:var(--card2);color:#d6d6de}
  .btn svg{width:18px;height:18px;flex:0 0 auto}
  .btn.primary{background:linear-gradient(180deg,#3488ff,#2069e0);border-color:#4f97ff;color:#fff;
               box-shadow:0 6px 18px rgba(45,127,249,.28)}
  .warn{font-size:11.5px;color:#c08a3e;background:#1c1408;border-left:2px solid #7a5410;
        padding:8px 10px;border-radius:0 8px 8px 0;line-height:1.7;margin-top:2px}

  /* 底部空闲条 */
  .idlebar{position:fixed;left:0;right:0;bottom:0;background:rgba(14,14,16,.96);backdrop-filter:blur(10px);
           border-top:1px solid var(--line);padding:10px 16px;
           display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--dim)}
  .idlebar b{color:var(--amber);font-variant-numeric:tabular-nums}
  .idlebar .bar{flex:1;height:3px;background:#242429;border-radius:3px;overflow:hidden;margin:0 4px}
  .idlebar .bar i{display:block;height:100%;width:62%;background:var(--amber);border-radius:3px;transition:width 1s linear}

  #toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(20px);
         background:#f0f0f4;color:#111;font-size:13px;font-weight:600;padding:9px 16px;border-radius:20px;
         opacity:0;transition:.22s;pointer-events:none;white-space:nowrap;z-index:9}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ffb454" stroke-width="1.8" stroke-linecap="round">
      <path d="M2 12h3M8 12h1M13 12h1M18 12h1M22 12h.01"/>
      <circle cx="5" cy="12" r="1.6" fill="#ffb454" stroke="none"/>
      <circle cx="11" cy="12" r="1.6" fill="#ffb454" stroke="none"/>
      <circle cx="16" cy="12" r="1.6" fill="#ffb454" stroke="none"/>
      <circle cx="20.5" cy="12" r="1.6" fill="#ffb454" stroke="none"/>
    </svg>
  </div>
  <div class="htxt">
    <h1>幻彩灯带控制板</h1>
    <div class="m"><span>PavoLED-A3</span><span class="chip" id="ver">v32.21</span></div>
  </div>
  <div class="live"><span class="dot"></span>在线 1</div>
</header>

<div class="stats">
  <div class="stat"><div class="k">当前模式</div><div class="v acc" id="sMode">双边跑马</div></div>
  <div class="stat"><div class="k">亮度</div><div class="v" id="sBright">50%</div></div>
  <div class="stat"><div class="k">灯数</div><div class="v" id="sCount">55</div></div>
</div>

<div class="card">
  <h2>灯光模式 <span class="hint">点选即时生效</span></h2>
  <div class="modes" id="modes"></div>
</div>

<div class="duo">
  <div class="card">
    <h2>亮度</h2>
    <div class="seg" id="brights"></div>
  </div>
  <div class="card">
    <h2>速度</h2>
    <div class="seg" id="speeds"></div>
  </div>
</div>

<div class="card">
  <h2>颜色 <span class="hint">仅单色类模式有效</span></h2>
  <div class="colors" id="colors"></div>
</div>

<div class="card">
  <h2>灯带长度 <span class="hint">断电记忆</span></h2>
  <div class="lenrow">
    <input id="cnt" type="number" min="1" max="128" value="55" inputmode="numeric">
    <button class="apply" onclick="applyCount()">应用</button>
  </div>
  <div class="chips" id="presets"></div>
</div>

<div class="actions">
  <a class="btn primary" href="https://app.betaflight.com" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v5h-5"/>
    </svg>
    飞控调参
  </a>
  <a class="btn" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 20h16"/>
    </svg>
    固件升级
  </a>
</div>

<div class="warn">
  连着本热点时上面的「飞控调参」打不开（本热点不联外网）。要离线用，请先断开热点、用移动数据打开
  app.betaflight.com 并「添加到主屏幕」；或用蓝牙连同名设备调参。
</div>

<div class="idlebar">
  <span>无线空闲 <b id="idle">00:42</b> 后自动关闭</span>
  <span class="bar"><i id="idlebar"></i></span>
</div>

<div id="toast"></div>

<script>
var MODES=["飞控同步","常亮","呼吸","跑马","双边跑马","导向","增长","彩虹呼吸","彩虹渐变","双边彩虹"];
var COLORS=[["白","#ffffff"],["红","#ff3b30"],["黄","#ffd60a"],["蓝","#3b82f6"],["绿","#22c55e"],["青","#22d3ee"],["品红","#e879f9"],["关","#000000"]];
var SPEEDS=["快","中","慢"], BRIGHTS=["100%","75%","50%","25%"], PRESETS=[32,55,60,78];
var st={mode:4,color:0,speed:1,bright:2,count:55};

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}

function build(){
  var mb=document.getElementById("modes"); mb.innerHTML="";
  MODES.forEach(function(nm,i){
    var b=el("button","mode"+(i==st.mode?" on":""));
    b.innerHTML='<span class="n">'+("0"+i).slice(-2)+'</span><span>'+nm+'</span>';
    b.onclick=function(){st.mode=i;build();sync();toast("模式："+nm);};
    mb.appendChild(b);
  });
  seg("brights",BRIGHTS,st.bright,function(i){st.bright=i;build();sync();toast("亮度："+BRIGHTS[i]);});
  seg("speeds",SPEEDS,st.speed,function(i){st.speed=i;build();sync();toast("速度："+SPEEDS[i]);});

  var cb=document.getElementById("colors"); cb.innerHTML="";
  COLORS.forEach(function(c,i){
    var b=el("button","sw"+(i==st.color?" on":"")+(i==7?" off":""));
    b.style.background=c[1]; b.title=c[0];
    b.onclick=function(){st.color=i;build();sync();toast("颜色："+c[0]);};
    cb.appendChild(b);
  });

  var pb=document.getElementById("presets"); pb.innerHTML="";
  PRESETS.forEach(function(n){
    var b=el("button",n==st.count?"on":"",String(n));
    b.onclick=function(){document.getElementById("cnt").value=n;applyCount();};
    pb.appendChild(b);
  });
}
function seg(id,arr,cur,cb){
  var box=document.getElementById(id); box.innerHTML="";
  arr.forEach(function(nm,i){
    var b=el("button",i==cur?"on":"",nm);
    b.onclick=function(){cb(i);};
    box.appendChild(b);
  });
}
function sync(){
  document.getElementById("sMode").textContent=MODES[st.mode];
  document.getElementById("sBright").textContent=BRIGHTS[st.bright];
  document.getElementById("sCount").textContent=st.count;
}
function applyCount(){
  var n=parseInt(document.getElementById("cnt").value,10);
  if(!n||n<1||n>128){toast("请输入 1-128");return;}
  st.count=n; build(); sync(); toast("灯数："+n);
}
var tt=null;
function toast(t){
  var d=document.getElementById("toast"); d.textContent=t; d.classList.add("show");
  clearTimeout(tt); tt=setTimeout(function(){d.classList.remove("show");},1600);
}

// 空闲倒计时（演示：60 秒循环）
var left=42;
setInterval(function(){
  left=left>0?left-1:60;
  document.getElementById("idle").textContent="00:"+(left<10?"0":"")+left;
  document.getElementById("idlebar").style.width=(left/60*100)+"%";
},1000);

build(); sync();
</script>
</body>
</html>
