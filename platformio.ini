; PAVO 20 Pro 幻彩灯带控制板（ESP32-C3 SuperMini）
; 框架：ESP-IDF 原生（RMT 驱动头文件 driver/rmt_*.h 为 IDF 内置组件）
; 编译：推 GitHub 由 Actions 自动编译，或本地 VS Code + PlatformIO
; 日志：通过 SuperMini 内置 USB 串口输出（见 sdkconfig.defaults）

[env:esp32-c3]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600
