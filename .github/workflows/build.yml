# ============================================================
# 在线编译：GitHub Actions + PlatformIO（ESP-IDF 框架）
# 用法：
#   1. 把整个 pavo20-led-controller 文件夹推到 GitHub 仓库（默认分支 main 或 master）
#   2. 仓库 Actions 页会自动编译（也可以在 Actions 页点 "Run workflow" 手动触发）
#   3. 编译完成后进入本次运行的页面，下载 "pavo20-led-firmware" 构件
#      里面 merged.bin 是合并固件，用 ESP Web Flasher 网页直接刷入
#   4. 排错：手动触发时可在 "Backtrace to decode" 输入框粘贴崩溃日志的
#      Backtrace 地址行，本次运行会打印每个地址对应的函数名
# ============================================================

name: Build ESP32-C3 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 允许在 Actions 页面手动触发
    inputs:
      backtrace:
        description: 'Backtrace addresses to decode, e.g. 0x4200172a:0x3fc962b0 0x42001924:0x3fc96350'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 缓存 PlatformIO 平台/工具链/缓存目录：避免每次重新下载 espressif32 平台包
      # （HTTPClientError 是下载超时；缓存命中后不再下载）
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.cache/pip
          key: ${{ runner.os }}-pio-v1

      - name: Install PlatformIO
        run: pip install --quiet platformio

      # 构建带重试：平台包下载偶发失败时自动重试
      - name: Build firmware
        run: |
          set -o pipefail
          for i in 1 2 3 4; do
            pio run && break
            echo "pio run failed (attempt $i), retrying..."
            sleep 8
          done
          pio run 2>&1 | tee build.log

      - name: List build outputs
        run: ls -laR .pio/build/esp32-c3 | head -80

      - name: Install esptool
        run: pip install --quiet esptool

      # 合并 bootloader + 分区表 + 固件为单文件，方便网页刷机
      # 分区布局（single factory）：0x0 bootloader / 0x8000 partitions / 0x10000 app
      - name: Merge firmware
        run: |
          BOOT=".pio/build/esp32-c3/bootloader.bin"
          [ -f "$BOOT" ] || BOOT=".pio/build/esp32-c3/bootloader/bootloader.bin"
          PART=".pio/build/esp32-c3/partitions.bin"
          [ -f "$PART" ] || PART=".pio/build/esp32-c3/partition_table/partition-table.bin"
          echo "bootloader: $BOOT"
          echo "partitions: $PART"
          python -m esptool --chip esp32c3 merge_bin -o merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0000 "$BOOT" \
            0x8000 "$PART" \
            0x10000 .pio/build/esp32-c3/firmware.bin

      # 手动触发时：把 Backtrace 里的地址解码成函数名（ESP32-C3 是 RISC-V）
      - name: Decode backtrace (optional)
        if: ${{ github.event.inputs.backtrace != '' }}
        run: |
          TOOL="$HOME/.platformio/packages/toolchain-riscv32-esp/bin/riscv32-esp-elf-addr2line"
          echo "Backtrace decode:"
          for a in $(echo "${{ github.event.inputs.backtrace }}" | grep -oE '0x[0-9a-fA-F]+'); do
            printf '%s -> ' "$a"
            "$TOOL" -pfiaC -e .pio/build/esp32-c3/firmware.elf "$a"
          done

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: pavo20-led-firmware
          path: |
            merged.bin
            .pio/build/esp32-c3/firmware.bin
            .pio/build/esp32-c3/firmware.elf
          if-no-files-found: error
